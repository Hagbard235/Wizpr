name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Every build must be signed with the same key, or Android refuses to install an update
      # over the previous version. Create that key once and commit it to the branch.
      - name: Create fixed debug signing key (first run only)
        if: github.event_name != 'pull_request'
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -keystore app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/debug.keystore
            git commit -m "Add fixed debug signing key for installable CI builds"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Test protocol core
        run: ./gradlew -p ringcore test

      - name: Build APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ring-notes-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Artifacts occasionally fail to register on GitHub even after a successful upload,
      # so the APK is also published to a rolling pre-release with a stable download link.
      - name: Publish APK to the "debug-latest" pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ring-notes-debug.apk
          notes="Automatisch gebaut aus ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Lässt sich über ältere Versionen (ab 0.3.0) installieren."
          # Keep one release and replace its asset: deleting and recreating it races with the
          # asset upload (the fresh release is not yet visible and the upload gets a 404).
          if ! gh release view debug-latest > /dev/null 2>&1; then
            gh release create debug-latest --prerelease --target "$GITHUB_SHA" \
              --title "Ring Notes – aktuelle Test-APK" --notes "$notes"
          fi
          for attempt in 1 2 3 4 5; do
            gh release upload debug-latest ring-notes-debug.apk --clobber && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
          gh release edit debug-latest --notes "$notes"
